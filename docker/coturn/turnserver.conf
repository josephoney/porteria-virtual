# turnserver.conf — Configuración de coturn (servidor TURN)
# Necesario para que WebRTC funcione entre redes diferentes (kiosk LAN ↔ operador internet)

# Puerto estándar STUN/TURN
listening-port=3478
tls-listening-port=5349

# Rango de puertos UDP para relay
min-port=49152
max-port=49200

# Cambiar por la IP pública del servidor
# external-ip=TU_IP_PUBLICA

# Realm y credenciales (cambiar en producción)
realm=porteria.local
user=porteria:cambiar_esta_clave

# Logging
log-file=/var/log/coturn/turnserver.log
syslog

# Seguridad: solo permite relay, no proxy
no-tcp-relay

# Fingerprint en mensajes STUN
fingerprint

# Long-term credential mechanism
lt-cred-mech
