events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirigir HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _ desktop-qsbneqe.tail8e9395.ts.net;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Raíz → página de selección ────────────────────────────────
        location = / {
            return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porteria Zima Seguridad</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0c0f;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:28px;text-align:center;padding:24px}img{width:160px;object-fit:contain}h1{font-size:22px;letter-spacing:5px;color:#6ea8fe;text-transform:uppercase;line-height:1.4}.links{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}a{display:block;padding:14px 0;border:1px solid #2a3450;border-radius:8px;color:#c9d6f5;text-decoration:none;font-size:14px;letter-spacing:3px;text-transform:uppercase;background:rgba(110,168,254,0.05)}a:hover{border-color:#6ea8fe;color:#6ea8fe;background:rgba(110,168,254,0.1)}</style></head><body><img src="/kiosk/images/LogoZima.png" alt="Zima Seguridad"><h1>Porteria Zima Seguridad</h1><div class="links"><a href="/kiosk/kiosk2.html">Kiosk</a><a href="/operator/index.html">Operador</a></div></body></html>';
            add_header Content-Type text/html;
        }

        # ── Kiosk ──────────────────────────────────────────────────────
        location /kiosk/ {
            alias /var/www/kiosk/;
            try_files $uri $uri/ /kiosk/index.html;
        }

        # ── Operator ───────────────────────────────────────────────────
        location /operator/ {
            alias /var/www/operator/;
            try_files $uri $uri/ /operator/index.html;
        }

        # ── Señalización WebSocket (Socket.io) ─────────────────────────
        location /socket.io/ {
            proxy_pass         http://signaling:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ── Health check del signaling server ──────────────────────────
        location /health {
            proxy_pass http://signaling:3001/health;
        }

        # ── CompreFace API (proxy para evitar mixed content) ──────────────
        location /compreface/ {
            proxy_pass         http://compreface-api:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            client_max_body_size 20M;
        }
    }
}
